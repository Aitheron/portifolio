<rect x="85" y="560" width="590" height="70" rx="10" fill="#eaf4fb" stroke="#497597"/>
<text x="380.0" y="602.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17334b">Generate tabular features</text>
