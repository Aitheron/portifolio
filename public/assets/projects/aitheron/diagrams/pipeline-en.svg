<text x="380.0" y="687.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17334b">Multitask MLP with</text>
<text x="380.0" y="714.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17334b">CORAL ordinal classification</text>
