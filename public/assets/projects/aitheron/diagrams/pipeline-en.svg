<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1060" viewBox="0 0 760 1060" role="img" aria-labelledby="title"><title id="title">Aitheron analysis pipeline</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#526779"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="380" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#17334b">Aitheron · Analysis pipeline</text>
<rect x="85" y="70" width="590" height="70" rx="10" fill="#eaf4fb" stroke="#497597"/>
<text x="380.0" y="112.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17334b">Start</text>
