<text x="380.0" y="295.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17334b">Retrieve BRCA1 / BRCA2</text>
<text x="380.0" y="322.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17334b">reference sequence via API</text>
<path d="M380 336 V361" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="85" y="364" width="590" height="70" rx="10" fill="#eaf4fb" stroke="#497597"/>
<text x="380.0" y="393.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17334b">Detect BRCA1 / BRCA2 variants</text>
<text x="380.0" y="420.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17334b">in the received FASTA</text>
