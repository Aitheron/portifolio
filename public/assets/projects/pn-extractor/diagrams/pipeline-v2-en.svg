<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title"><title id="title">Asynchronous staged pipeline</title><defs><radialGradient id="glow"><stop stop-color="#133b4a"/><stop offset="1" stop-color="#07121d"/></radialGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#5bd8df"/></marker></defs><rect width="1280" height="800" fill="url(#glow)"/><g font-family="Arial, Helvetica, sans-serif"><text x="58" y="57" fill="#72dde0" font-size="15" letter-spacing="3">CONCEPTUAL ARCHITECTURE</text><text x="58" y="109" fill="#dcebf4" font-size="37" font-weight="700">Asynchronous staged pipeline</text><text x="58" y="151" fill="#a4bccb" font-size="21" >Batches advance independently; different stages run at the same time.</text><rect x="58" y="188" width="157" height="87" rx="12" fill="#102330" stroke="#294959"/><text x="70" y="215" fill="#65dce1" font-size="14" >01</text><text x="70" y="246" fill="#dcebf4" font-size="17" >Cleaning</text><path d="M216 232 L223 232" stroke="#5bd8df" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="226" y="188" width="157" height="87" rx="12" fill="#102330" stroke="#294959"/><text x="238" y="215" fill="#7dc7f4" font-size="14" >02</text><text x="238" y="246" fill="#dcebf4" font-size="17" >Embeddings</text><path d="M384 232 L391 232" stroke="#5bd8df" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="394" y="188" width="157" height="87" rx="12" fill="#102330" stroke="#294959"/><text x="406" y="215" fill="#a1a4fa" font-size="14" >03</text><text x="406" y="246" fill="#dcebf4" font-size="17" >Retrieval</text><path d="M552 232 L559 232" stroke="#5bd8df" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="562" y="188" width="157" height="87" rx="12" fill="#102330" stroke="#294959"/><text x="574" y="215" fill="#c0a2f2" font-size="14" >04</text><text x="574" y="246" fill="#dcebf4" font-size="17" >Prompt</text><path d="M720 232 L727 232" stroke="#5bd8df" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="188" width="157" height="87" rx="12" fill="#102330" stroke="#294959"/><text x="742" y="215" fill="#e0b37c" font-size="14" >05</text><text x="742" y="246" fill="#dcebf4" font-size="17" >LLM</text><path d="M888 232 L895 232" stroke="#5bd8df" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="898" y="188" width="157" height="87" rx="12" fill="#102330" stroke="#294959"/><text x="910" y="215" fill="#83d9b4" font-size="14" >06</text><text x="910" y="246" fill="#dcebf4" font-size="17" >Post-validation</text><path d="M1056 232 L1063 232" stroke="#5bd8df" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="1066" y="188" width="157" height="87" rx="12" fill="#102330" stroke="#294959"/><text x="1078" y="215" fill="#bcdf9d" font-size="14" >07</text><text x="1078" y="246" fill="#dcebf4" font-size="17" >Output</text><text x="58" y="305" fill="#a4bccb" font-size="18" >Retrieval: cosine similarity + curated-example fallback.</text><rect x="616" y="342" width="112" height="274" rx="8" fill="#153c45" stroke="#4d8994"/><text x="58" y="341" fill="#a4bccb" font-size="13" >BATCHES</text><text x="172" y="370" fill="#a4bccb" font-size="14" >t1</text><text x="288" y="370" fill="#a4bccb" font-size="14" >t2</text><text x="404" y="370" fill="#a4bccb" font-size="14" >t3</text><text x="520" y="370" fill="#a4bccb" font-size="14" >t4</text><text x="636" y="370" fill="#a4bccb" font-size="14" >t5</text><text x="752" y="370" fill="#a4bccb" font-size="14" >t6</text><text x="868" y="370" fill="#a4bccb" font-size="14" >t7</text><text x="984" y="370" fill="#a4bccb" font-size="14" >t8</text><text x="1100" y="370" fill="#a4bccb" font-size="14" >t9</text><text x="65" y="424" fill="#dcebf4" font-size="23" >A</text><rect x="157" y="392" width="102" height="50" rx="7" fill="#102330" stroke="#65dce1"/><text x="195" y="424" fill="#65dce1" font-size="19" >01</text><rect x="273" y="392" width="102" height="50" rx="7" fill="#102330" stroke="#7dc7f4"/><text x="311" y="424" fill="#7dc7f4" font-size="19" >02</text><rect x="389" y="392" width="102" height="50" rx="7" fill="#102330" stroke="#a1a4fa"/><text x="427" y="424" fill="#a1a4fa" font-size="19" >03</text><rect x="505" y="392" width="102" height="50" rx="7" fill="#102330" stroke="#c0a2f2"/><text x="543" y="424" fill="#c0a2f2" font-size="19" >04</text><rect x="621" y="392" width="102" height="50" rx="7" fill="#102330" stroke="#e0b37c"/><text x="659" y="424" fill="#e0b37c" font-size="19" >05</text><rect x="737" y="392" width="102" height="50" rx="7" fill="#102330" stroke="#83d9b4"/><text x="775" y="424" fill="#83d9b4" font-size="19" >06</text><rect x="853" y="392" width="102" height="50" rx="7" fill="#102330" stroke="#bcdf9d"/><text x="891" y="424" fill="#bcdf9d" font-size="19" >07</text><text x="65" y="494" fill="#dcebf4" font-size="23" >B</text><rect x="273" y="462" width="102" height="50" rx="7" fill="#102330" stroke="#65dce1"/><text x="311" y="494" fill="#65dce1" font-size="19" >01</text><rect x="389" y="462" width="102" height="50" rx="7" fill="#102330" stroke="#7dc7f4"/><text x="427" y="494" fill="#7dc7f4" font-size="19" >02</text><rect x="505" y="462" width="102" height="50" rx="7" fill="#102330" stroke="#a1a4fa"/><text x="543" y="494" fill="#a1a4fa" font-size="19" >03</text><rect x="621" y="462" width="102" height="50" rx="7" fill="#102330" stroke="#c0a2f2"/><text x="659" y="494" fill="#c0a2f2" font-size="19" >04</text><rect x="737" y="462" width="102" height="50" rx="7" fill="#102330" stroke="#e0b37c"/><text x="775" y="494" fill="#e0b37c" font-size="19" >05</text><rect x="853" y="462" width="102" height="50" rx="7" fill="#102330" stroke="#83d9b4"/><text x="891" y="494" fill="#83d9b4" font-size="19" >06</text><rect x="969" y="462" width="102" height="50" rx="7" fill="#102330" stroke="#bcdf9d"/><text x="1007" y="494" fill="#bcdf9d" font-size="19" >07</text><text x="65" y="564" fill="#dcebf4" font-size="23" >C</text><rect x="389" y="532" width="102" height="50" rx="7" fill="#102330" stroke="#65dce1"/><text x="427" y="564" fill="#65dce1" font-size="19" >01</text><rect x="505" y="532" width="102" height="50" rx="7" fill="#102330" stroke="#7dc7f4"/><text x="543" y="564" fill="#7dc7f4" font-size="19" >02</text><rect x="621" y="532" width="102" height="50" rx="7" fill="#102330" stroke="#a1a4fa"/><text x="659" y="564" fill="#a1a4fa" font-size="19" >03</text><rect x="737" y="532" width="102" height="50" rx="7" fill="#102330" stroke="#c0a2f2"/><text x="775" y="564" fill="#c0a2f2" font-size="19" >04</text><rect x="853" y="532" width="102" height="50" rx="7" fill="#102330" stroke="#e0b37c"/><text x="891" y="564" fill="#e0b37c" font-size="19" >05</text><rect x="969" y="532" width="102" height="50" rx="7" fill="#102330" stroke="#83d9b4"/><text x="1007" y="564" fill="#83d9b4" font-size="19" >06</text><rect x="1085" y="532" width="102" height="50" rx="7" fill="#102330" stroke="#bcdf9d"/><text x="1123" y="564" fill="#bcdf9d" font-size="19" >07</text><text x="58" y="661" fill="#dcebf4" font-size="20" >At the same instant: C retrieves context, B assembles the prompt and A runs the LLM.</text><text x="58" y="704" fill="#a4bccb" font-size="18" >Each batch preserves stage order; the entire dataset does not wait at a global barrier.</text><text x="58" y="755" fill="#8eacbd" font-size="16" >Illustrative time, not to scale. Does not represent measured durations or internal topology.</text></g></svg>
