<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1320" viewBox="0 0 640 1320" role="img" aria-labelledby="title desc">
<title id="title">Fluxo de IA especializada</title>
<desc id="desc">Informações do produto → Triagem de informações → Faltam informações? → Esclarecer → Continuar → Descrição estruturada → Candidatos de → classificação fiscal → Validação por IA / Juiz → Atributos do produto → Resultado estruturado → Revisão humana</desc>
